[project]
name = "demand-engine"
version = "1.0.0"
description = "End-to-end demand forecasting and intelligent inventory optimization engine (M5 / Walmart)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "lightgbm>=4.3",
    "mlflow-skinny>=2.16",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=16",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scipy>=1.13",
    "shap>=0.46",
    "sqlalchemy>=2.0.30",
    "statsforecast>=1.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[project.scripts]
demand-engine = "demand_engine.pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_engine"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "T20", "PL", "D"]
ignore = [
    "D203", "D213",          # conflicting docstring styles; we use D211/D212
    "PLR0913", "PLR0917",    # numeric kernels / FastAPI handlers legitimately take many params
    "PLR2004",               # magic numbers in tests / formulas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "N802", "N803", "N806"]
# Lazy imports on purpose: fast CLI start-up and MLflow stays an optional runtime cost.
"src/demand_engine/pipelines/cli.py" = ["PLC0415"]
"src/demand_engine/pipelines/tracking.py" = ["PLC0415"]
"src/demand_engine/api/db/migrations/**" = ["D", "N999"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["demand_engine"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["statsforecast.*", "lightgbm.*", "shap.*", "mlflow.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
implicit_reexport = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs a running PostgreSQL (DATABASE__URL)",
    "slow: longer-running end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning:shap.*",  # third-party matplotlib API notice
]

[tool.coverage.run]
source = ["demand_engine"]
omit = ["*/migrations/*"]
